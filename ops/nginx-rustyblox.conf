# Rusty-Blox reverse proxy + TLS termination (Let's Encrypt direct)
#
# Topology:  Internet -> nginx :443 (real cert) -> rustyblox 127.0.0.1:3005
# Backend binds loopback only (config.toml: host = "127.0.0.1"); port 3005 is
# never exposed. The frontend (SPA + API + /ws + /websocket) is all
# same-origin/relative, so this is a transparent proxy plus defense-in-depth
# (rate limit, header policy, /metrics block, method allow-list).
#
# Install:
#   cp ops/nginx-rustyblox.conf /etc/nginx/sites-available/rustyblox
#   ln -sf /etc/nginx/sites-available/rustyblox /etc/nginx/sites-enabled/rustyblox
#   rm -f /etc/nginx/sites-enabled/default
#   grep -nP "[^\x00-\x7F]" /etc/nginx/sites-enabled/rustyblox   # must be empty
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d explorer.yourdomain.com --redirect --hsts --staple-ocsp \
#           --agree-tos -m you@email.com --no-eff-email
#
# Prometheus note: /metrics is blocked at the edge (below). Scrape the backend
# directly on the box: http://127.0.0.1:3005/metrics

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# only allow sane methods; anything else -> 405
map $request_method $bad_method {
    default 1;
    GET     0;
    HEAD    0;
    POST    0;
    OPTIONS 0;
}

limit_req_zone  $binary_remote_addr zone=api:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

upstream rustyblox {
    server 127.0.0.1:3005;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name explorer.yourdomain.com;     # set your domain

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    large_client_header_buffers 4 16k;

    limit_conn conn 20;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    if ($bad_method) { return 405; }

    location = /metrics { return 404; }              # never expose Prometheus
    location ~ /\.(?!well-known) { deny all; }       # no dotfiles (keep ACME)

    location /ws/ {
        proxy_pass http://rustyblox;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Blockbook JSON websocket protocol (separate from the /ws/* push channels)
    location = /websocket {
        proxy_pass http://rustyblox;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://rustyblox;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        proxy_pass http://rustyblox;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://rustyblox;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm text/javascript image/svg+xml application/xml;
}
