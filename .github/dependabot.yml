version: 2
updates:
  # Rust backend
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait 7 days before proposing a newly published version (gives a window for
    # a compromised/yanked release to be caught before it lands in a PR).
    cooldown:
      default-days: 7
    groups:
      # Batch patch/minor bumps into one PR to cut review noise.
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # bincode defines the persisted analytics blob format (a change forces a
      # re-enrich); 3.0.0 is a tombstone release that only contains compile_error!.
      - dependency-name: bincode
        update-types: ["version-update:semver-major"]
      # 0.26 -> 0.32 breaks bip32/Script/network APIs; only used for xpub derivation.
      - dependency-name: bitcoin
        update-types: ["version-update:semver-major"]
      # sha2 0.10 and ripemd (successor to ripemd160) share digest 0.10: migrate
      # both by hand in one change, not as two broken PRs.
      - dependency-name: sha2
        update-types: ["version-update:semver-major"]
      - dependency-name: ripemd160
        update-types: ["version-update:semver-major"]

  # Served frontend (built into frontend/dist)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-minor:
        update-types: [minor, patch]

  # Legacy frontend (kept for reference, not served)
  - package-ecosystem: npm
    directory: "/frontend-legacy"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-minor:
        update-types: [minor, patch]

  # The workflow actions themselves -- keeps the SHA pins current (Dependabot
  # understands `uses: owner/repo@<sha> # vX` and bumps both SHA and comment).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
